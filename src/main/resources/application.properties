# Single source of truth for anything environment-shaped.
# Loaded by com.example.weather.util.Config; every value can be overridden with a JVM system
# property of the same name, e.g. -Dopenmeteo.forecast.url=http://localhost:8080/forecast

openmeteo.geocoding.url=https://geocoding-api.open-meteo.com/v1/search
openmeteo.forecast.url=https://api.open-meteo.com/v1/forecast

http.connect.timeout.seconds=5
http.request.timeout.seconds=10

cache.ttl.minutes=10

# How many days of the forecast strip the UI shows.
forecast.days=5

# How many recent searches the history keeps.
history.size=5
